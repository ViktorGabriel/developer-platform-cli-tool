[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudsec-cli"
version = "0.1.0"
description = "CloudSec & Container Audit CLI - Auditoria de segurança para Dockerfiles, containers e arquivos de configuração"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Viktor Gabriel", email = "viktorgabriel@example.com" }
]
keywords = ["security", "cloudsec", "devops", "container", "docker", "audit", "secrets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
cloudsec = "cloudsec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudsec"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
